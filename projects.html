<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>專案</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #FAF7F2; color: #3A2E24; min-height: 100vh; padding-bottom: 80px; }
    .header { background: #7A5C3E; color: white; padding: 16px 20px; padding-top: calc(16px + env(safe-area-inset-top)); }
    .header h1 { font-size: 18px; font-weight: 600; }
    .list { padding: 16px; }
    .proj-card { background: white; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); overflow: hidden; }
    .proj-head { padding: 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .proj-name { font-size: 15px; font-weight: 600; }
    .proj-total { font-size: 15px; font-weight: 700; color: #7A5C3E; }
    .proj-body { padding: 0 16px 12px; display: none; border-top: 1px solid #F0E8E0; }
    .proj-body.open { display: block; }
    .rec { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #F5EFE8; }
    .rec:last-child { border-bottom: none; }
    .rec-cat { font-size: 14px; font-weight: 500; }
    .rec-sub { font-size: 12px; color: #999; margin-top: 2px; }
    .rec-twd { font-size: 14px; font-weight: 700; }
    .rec-date { font-size: 11px; color: #bbb; margin-top: 2px; text-align: right; }
    .by-cur { padding: 10px 0 2px; font-size: 12px; color: #888; }
    .by-cur span { margin-right: 12px; }
    .empty-state { text-align: center; padding: 40px 20px; color: #bbb; font-size: 14px; }
    .empty-state .emoji { font-size: 40px; margin-bottom: 12px; }
    .loading { text-align: center; padding: 30px; color: #bbb; font-size: 14px; }
    .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #E8E0D8; display: flex; padding-bottom: env(safe-area-inset-bottom); }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 0; text-decoration: none; color: #bbb; font-size: 10px; gap: 3px; }
    .tab-item.active { color: #7A5C3E; }
    .tab-item .icon { font-size: 22px; }
    .tab-add { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 0; text-decoration: none; }
    .tab-add .add-btn { width: 48px; height: 48px; background: #7A5C3E; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: white; box-shadow: 0 2px 8px rgba(122,92,62,0.4); margin-top: -16px; }
  </style>
</head>
<body>
  <div class="header"><h1>📁 專案</h1></div>
  <div class="list" id="list"><div class="loading">載入中…</div></div>

  <nav class="tab-bar">
    <a href="index.html" class="tab-item"><span class="icon">🏠</span><span>總覽</span></a>
    <a href="add.html" class="tab-add"><div class="add-btn">＋</div></a>
    <a href="settlement.html" class="tab-item"><span class="icon">🧾</span><span>結算</span></a>
    <a href="stats.html" class="tab-item"><span class="icon">📊</span><span>統計</span></a>
    <a href="projects.html" class="tab-item active"><span class="icon">📁</span><span>專案</span></a>
  </nav>

  <script src="js/api.js"></script>
  <script>
    const CUR_SIGN = { TWD: 'NT$', USD: 'US$', KRW: '₩', JPY: '¥', EUR: '€', CNY: '¥' };
    function nt(n) { return 'NT$ ' + Math.round(n).toLocaleString(); }
    function origFmt(cur, amt) { return (CUR_SIGN[cur] || cur + ' ') + Math.round(amt).toLocaleString(); }

    async function loadProjects() {
      const list = document.getElementById('list');
      try {
        const data = await API.apiGet('getProjects');
        const projects = data.projects || [];
        if (projects.length === 0) {
          list.innerHTML = '<div class="empty-state"><div class="emoji">📭</div>還沒有專案<br>記帳時選「📁 專案」即可建立</div>';
          return;
        }
        list.innerHTML = projects.map(p => `
          <div class="proj-card">
            <div class="proj-head" onclick="toggleProject(this, '${encodeURIComponent(p.project)}')">
              <div class="proj-name">${p.project}</div>
              <div class="proj-total">${nt(p.total)}</div>
            </div>
            <div class="proj-body"><div class="loading">載入中…</div></div>
          </div>`).join('');
      } catch (e) {
        list.innerHTML = '<div class="empty-state"><div class="emoji">⚠️</div>載入失敗，請確認網路</div>';
      }
    }

    async function toggleProject(headEl, projEnc) {
      const body = headEl.nextElementSibling;
      const open = body.classList.toggle('open');
      if (!open || body.dataset.loaded) return;
      const project = decodeURIComponent(projEnc);
      try {
        const data = await API.apiGet('getProjectRecords', { project });
        const recs = data.records || [];
        const byCur = data.byCurrency || {};
        const curLine = Object.keys(byCur)
          .map(c => `<span>${origFmt(c, byCur[c])}</span>`).join('');
        body.innerHTML = `
          <div class="by-cur">${curLine}</div>
          ${recs.map(r => `
            <div class="rec">
              <div>
                <div class="rec-cat">${r.category || '其他'}</div>
                <div class="rec-sub">${r.currency === 'TWD'
                  ? ''
                  : origFmt(r.currency, r.orig_amount) + ' → ' + nt(r.amount) + ' @' + r.rate}${r.note ? '　' + r.note : ''}</div>
              </div>
              <div>
                <div class="rec-twd">${nt(r.amount)}</div>
                <div class="rec-date">${r.date || ''}</div>
              </div>
            </div>`).join('')}
        `;
        body.dataset.loaded = '1';
      } catch (e) {
        body.innerHTML = '<div class="empty-state">載入失敗</div>';
      }
    }

    loadProjects();
  </script>
</body>
</html>
